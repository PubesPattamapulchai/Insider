<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <title>Insider Player</title>
  <link rel="stylesheet" href="./theme.css">
</head>
<body>
<main class="app player-app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">🗝️</div><div><h1>Insider</h1><p>การ์ด Role ส่วนตัว</p></div></div>
    <span id="connectionStatus" class="status">กำลังเชื่อม…</span>
  </header>

  <div class="player-shell">
    <section id="joinView" class="card join-card">
      <div class="eyebrow">JOIN ROOM</div>
      <h2>เข้าห้องเกม</h2>
      <p>ใส่ Room Code จาก Host และชื่อที่ใช้เล่น</p>
      <div class="stack" style="margin-top:18px">
        <input id="roomInput" class="field room" maxlength="6" placeholder="IABCDE" autocomplete="off">
        <input id="nameInput" class="field" maxlength="24" placeholder="ชื่อผู้เล่น" autocomplete="nickname">
        <button id="joinBtn" class="btn primary big">เข้าห้อง</button>
      </div>
    </section>

    <section id="gameView" class="hidden stack">
      <div class="row between wrap">
        <span class="status">ROOM <b id="roomText">—</b></span>
        <span id="meText" class="status">—</span>
      </div>

      <section id="waitingCard" class="card hero-card">
        <div class="eyebrow">WAITING</div>
        <h2 id="waitingTitle">รอ Host สุ่ม Role</h2>
        <p id="waitingCopy">เมื่อสุ่มแล้ว การ์ดลับของคุณจะปรากฏตรงนี้</p>
      </section>

      <section id="roleArea" class="card panel hidden">
        <div class="panel-head"><div><div class="panel-title">การ์ดลับของคุณ</div><div class="panel-desc">อย่าให้คนอื่นเห็นหน้าจอ</div></div></div>
        <button id="roleRevealBtn" class="btn primary big" style="width:100%">🔒 แตะเพื่อดู Role</button>
        <div id="roleCard" class="hidden" style="margin-top:12px"></div>
      </section>

      <section class="card panel">
        <div class="panel-head"><div><div class="panel-title">ผู้เล่นในห้อง</div><div class="panel-desc">รายชื่อนี้ไม่เปิดเผย Role</div></div></div>
        <div id="playerList" class="players"></div>
      </section>
    </section>
  </div>
</main>
<script type="module" src="./player.js"></script>
</body>
</html>
